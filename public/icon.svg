<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Deep Obsidian & Indigo Background Gradient -->
    <radialGradient id="bg" cx="50%" cy="0%" r="100%" fx="50%" fy="0%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0a0a0a" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
    
    <!-- Luxury Gold Gradient -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Glowing Drop Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#f59e0b" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Base (iOS Squircle Shape) -->
  <rect width="512" height="512" rx="115" fill="url(#bg)" />

  <!-- Outer Ring with Glow -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#gold)" stroke-width="8" filter="url(#glow)" opacity="0.9"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.3" stroke-dasharray="10 10"/>

  <!-- The "EM" Monogram -->
  <text x="50%" y="54%" font-family="system-ui, -apple-system, sans-serif" font-size="160" font-weight="900" fill="url(#gold)" text-anchor="middle" dominant-baseline="middle" filter="url(#glow)" letter-spacing="-5">EM</text>

  <!-- Premium Subtitle -->
  <text x="50%" y="78%" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#a3a3a3" text-anchor="middle" letter-spacing="14">EARNMEGA</text>
</svg>
